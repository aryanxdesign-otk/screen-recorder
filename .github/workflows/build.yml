name: Build

on:
  push:
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v4
      - name: Show toolchain
        run: xcodebuild -version && swift --version
      - name: Build Scouter
        run: |
          xcodebuild -project Scouter.xcodeproj -scheme Scouter -configuration Debug \
            -destination 'platform=macOS' CODE_SIGNING_ALLOWED=NO -quiet build
