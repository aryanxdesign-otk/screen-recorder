name: Build

on:
  push:
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v4
      - name: Show toolchain
        run: xcodebuild -version && swift --version
      - name: Build Scouter
        run: |
          xcodebuild -project Scouter.xcodeproj -scheme Scouter -configuration Debug \
            -destination 'platform=macOS,arch=arm64' CODE_SIGNING_ALLOWED=NO -quiet build
      - name: Pipeline checks
        run: |
          mkdir -p build
          xcrun swiftc -swift-version 5 -parse-as-library -O -target arm64-apple-macos15.0 \
            Checks/PipelineCheck.swift Scouter/Model/*.swift Scouter/Rendering/*.swift Scouter/App/Theme.swift Scouter/Recording/RecordingClock.swift \
            -o build/pipeline-check
          ./build/pipeline-check build/check
      - name: Print preview images
        if: always()
        run: |
          cd build/check 2>/dev/null || exit 0
          for f in still-0.30s.jpg still-1.10s.jpg still-2.00s.jpg export-frame-1.10s.jpg variant-vertical.jpg variant-solid.jpg; do
            [ -f "$f" ] || continue
            sips -Z 960 -s formatOptions 60 "$f" --out "/tmp/small-$f" >/dev/null
            echo "BEGIN-B64 $f"
            base64 -i "/tmp/small-$f" | fold -w 4000
            echo "END-B64 $f"
          done
      - name: Upload check output
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pipeline-check
          path: build/check
          if-no-files-found: ignore
