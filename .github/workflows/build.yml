name: Build

on:
  push:
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v4
      - name: Show toolchain
        run: xcodebuild -version && swift --version
      - name: Build Scouter
        run: |
          xcodebuild -project Scouter.xcodeproj -scheme Scouter -configuration Debug \
            -destination 'platform=macOS,arch=arm64' CODE_SIGNING_ALLOWED=NO -quiet build
      - name: Build downloadable app (Release, universal, ad-hoc signed)
        run: |
          xcodebuild -project Scouter.xcodeproj -scheme Scouter -configuration Release \
            -destination 'generic/platform=macOS' -derivedDataPath build/dd -quiet build
          app=build/dd/Build/Products/Release/Scouter.app
          codesign --verify --deep --verbose "$app"
          lipo -archs "$app/Contents/MacOS/Scouter"
          mkdir -p build/dmg
          ditto "$app" build/dmg/Scouter.app
          ln -s /Applications build/dmg/Applications
          # hdiutil is occasionally "busy" on hosted runners; retry a few times.
          for i in 1 2 3 4 5; do
            hdiutil create -volname Scouter -srcfolder build/dmg -ov -format UDZO build/Scouter.dmg && break
            sleep 5
          done
          hdiutil verify build/Scouter.dmg
          # Mount it the way a user would and check the app inside is intact.
          mount=$(hdiutil attach -nobrowse -readonly build/Scouter.dmg | tail -1 | awk -F'\t' '{print $NF}')
          codesign --verify --deep --verbose "$mount/Scouter.app"
          hdiutil detach "$mount"
      - name: Upload app
        uses: actions/upload-artifact@v4
        with:
          name: Scouter-app
          path: build/Scouter.dmg
      - name: Pipeline checks
        run: |
          mkdir -p build
          xcrun swiftc -swift-version 5 -parse-as-library -O -target arm64-apple-macos15.0 \
            Checks/PipelineCheck.swift Scouter/Model/*.swift Scouter/Rendering/*.swift Scouter/App/Theme.swift Scouter/Recording/RecordingClock.swift \
            -o build/pipeline-check
          ./build/pipeline-check build/check
      - name: Print review grid
        if: always()
        run: |
          f=build/check/review-grid.jpg
          [ -f "$f" ] || exit 0
          echo "BEGIN-B64 review-grid.jpg $(wc -c < "$f") bytes"
          base64 -i "$f" | fold -w 8000
          echo "END-B64 review-grid.jpg"
      - name: Upload check output
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pipeline-check
          path: build/check
          if-no-files-found: ignore
